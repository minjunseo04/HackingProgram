name: Build and publish Windows app

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows package
        shell: pwsh
        run: ./desktop/publish.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          ./website/downloads/BoundaryCheck-win-x64.zip
          --title "BoundaryCheck $env:GITHUB_REF_NAME"
          --generate-notes
